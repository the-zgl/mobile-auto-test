name: CI

on:
  push:
  pull_request:

jobs:
  # ---- 不需要设备的静态校验 + 框架自检：PR 秒级反馈 ----
  static-check:
    name: 静态校验与框架自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax check (py_compile)
        run: python -m py_compile conftest.py pages/*.py tests/*.py

      - name: Validate Android layouts and id contract
        run: |
          python - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET, sys
          layout_files = glob.glob('demo-app/app/src/main/res/layout/*.xml')
          value_files = glob.glob('demo-app/app/src/main/res/values/*.xml')
          if not layout_files:
              print('未找到 demo-app 布局文件'); sys.exit(1)

          merged = ''
          for f in layout_files:
              merged += open(f, encoding='utf-8').read()
              ET.parse(f)   # XML 格式不合法会直接抛异常

          # res/values/*.xml 里声明的 id（例如 ids.xml 里的 ListView 行 id）
          declared = ''
          for f in value_files:
              ET.parse(f)
              declared += open(f, encoding='utf-8').read()

          missing = [i for i in ('username', 'password', 'login', 'error',
                                 'tv_balance', 'tv_pay_success', 'btn_buy')
                     if f'@+id/{i}"' not in merged]

          # item_0..item_4 必须在资源里真实声明过，否则 R.id.item_0 编译期就报错
          for row_id in ('item_0', 'item_1', 'item_2', 'item_3', 'item_4'):
              if f'name="{row_id}"' not in declared and f'@+id/{row_id}"' not in merged:
                  missing.append(row_id)

          if missing:
              print('缺少控件 id 声明:', missing); sys.exit(1)
          print('布局与 id 契约校验通过：', len(layout_files), '个布局，', len(value_files), '个 values 文件')
          EOF

      - name: Validate manifest (XML)
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('demo-app/app/src/main/AndroidManifest.xml'); print('manifest ok')"

      - name: Collect tests (smoke)
        run: pytest --collect-only -q

      - name: Run device-free framework tests
        run: pytest --no-device -q

  # ---- 真实设备用例：需要自建 runner 或接入云真机，用仓库变量开关 ----
  device-tests:
    name: 真机/模拟器用例（可选）
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEVICE_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Build demo app APK
        run: |
          cd demo-app
          if [ ! -f gradlew ]; then
            echo "::error::demo-app 目录下没有 gradle wrapper（gradlew）。"
            echo "请在本地执行：cd demo-app && gradle wrapper --gradle-version 8.7"
            echo "然后把 gradlew / gradlew.bat / gradle/wrapper/ 一起提交上来。"
            exit 1
          fi
          # 仓库里已用 git update-index --chmod=+x 记录执行位，这里再兜底一次
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            # Appium 版本要锁：最新版 Appium 3.x 要求 Node >= 20.19，
            # 而 GitHub runner 上 npm install -g appium 默认会装最新版，driver 也跟着装最新，
            # 组合不可控。这里显式锁到已验证过的组合。
            npm install -g appium@2.19.0
            appium driver install uiautomator2@4.2.1
            appium --version
            appium --log-level info &
            sleep 15
            adb install -r demo-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            pytest -m smoke --html=reports/report.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/

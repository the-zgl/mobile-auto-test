# Appium 自动化测试配置
# 按你的环境修改 deviceName / platformVersion / appPackage / appActivity
# deviceName 用 `adb devices` 命令查看（模拟器一般是 emulator-5554）

appium:
  url: "http://127.0.0.1:4723"   # Appium 服务地址

caps:
  platformName: "Android"
  # 用 `adb shell getprop ro.build.version.release` 查真实版本再填
  platformVersion: "9"
  # 用 `adb devices` 查设备名；多台设备并存时（如模拟器多开）务必指定目标实例，
  # 否则 Appium 会自己挑一台，可能连到没装被测 App 的设备上
  deviceName: "emulator-5560"
  automationName: "UiAutomator2"
  appPackage: "com.daping.demoshop"   # 被测 App 包名（本项目自带的 demo-app）
  appActivity: ".LoginActivity"       # 被测 App 启动页
  noReset: true
